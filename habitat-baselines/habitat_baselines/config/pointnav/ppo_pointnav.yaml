# @package _global_

defaults:
  - /benchmark/nav/pointnav: pointnav_habitat_test
  - /habitat_baselines: habitat_baselines_rl_config_base
  - _self_

habitat_baselines:
  trainer_name: ppo
  torch_gpu_id: 0

  tensorboard_dir: tb/orion_20000_v2
  video_dir: video_dir

  test_episode_count: 50
  eval_ckpt_path_dir: data/orion_10000_checkpoints_v2

  num_environments: 1
  checkpoint_folder: data/orion_10000_checkpoints_v2

  # Continue ORION training to 20,000 updates
  num_updates: 20000
  total_num_steps: -1

  # Resume from the existing 10,000-update ORION checkpoint
  load_resume_state_config: true

  log_interval: 10
  num_checkpoints: 10

  force_torch_single_threaded: true

  eval:
    video_option: []

  rl:

    # ============================================================
    # ORION AUXILIARY LOSS
    # ============================================================
    auxiliary_losses:
      orion:
        loss_scale: 0.05
        target_temperature: 1.0
        hidden_dim: 256

    # ============================================================
    # PPO
    # ============================================================
    ppo:
      clip_param: 0.1
      ppo_epoch: 1
      num_mini_batch: 1

      value_loss_coef: 0.5
      entropy_coef: 0.01

      lr: 0.00025
      eps: 0.00001

      max_grad_norm: 0.5

      num_steps: 32

      hidden_size: 512

      use_gae: true
      gamma: 0.99
      tau: 0.95

      use_linear_clip_decay: true
      use_linear_lr_decay: true

      reward_window_size: 50